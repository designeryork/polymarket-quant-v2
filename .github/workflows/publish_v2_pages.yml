name: Publish Paper v2 Dashboard

# 从 state-snapshot 分支取 dashboard_paper.html，发布到本仓 gh-pages 分支。
# 这样不需要外部 Pages 仓，也不需要 PAT：用 GITHUB_TOKEN + contents: write。
#
# 频率：每 5 分钟一次（GitHub cron 下限）。引擎每 5 分钟推一次快照，
# 页面最坏延迟约 10 分钟；页面自身仍有 15 秒自动刷新，但内容来自最近一次发布。

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: publish-paper-v2-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Dashboard From State Snapshot
        run: |
          git fetch origin state-snapshot --depth=1 || {
            echo "::warning::state-snapshot 分支还不存在，跳过"
            exit 0
          }
          if ! git show origin/state-snapshot:dashboard_paper.html > /tmp/index.html 2>/dev/null; then
            echo "::warning::state-snapshot 还没有 dashboard_paper.html，跳过"
            exit 0
          fi
          echo "dashboard bytes: $(wc -c < /tmp/index.html)"

      - name: Publish To gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/index.html ]; then
            echo "::warning::没有可发布的 dashboard，跳过"
            exit 0
          fi
          PAGES_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 不能再用 git init + --force：那会把 parity.html 等研究页一起删掉。
          # 每次尝试都重新克隆最新 gh-pages，只替换 index.html，保留其它文件。
          for attempt in 1 2 3; do
            rm -rf /tmp/pages
            if git clone --depth 1 --branch gh-pages "$PAGES_URL" /tmp/pages 2>/dev/null; then
              :
            else
              mkdir -p /tmp/pages
              cd /tmp/pages
              git init -b gh-pages
              git remote add origin "$PAGES_URL"
            fi
            cp /tmp/index.html /tmp/pages/index.html
            touch /tmp/pages/.nojekyll
            cd /tmp/pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html .nojekyll
            if git diff --cached --quiet; then
              echo "面板无变化，跳过提交"
              exit 0
            fi
            git commit -m "update paper v2 dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "::warning::gh-pages 推送冲突，重试 $attempt/3"
            sleep 3
          done
          echo "::error::gh-pages 推送连续失败"
          exit 1
